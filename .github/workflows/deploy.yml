# Put the web app and the online demo on the website: osabooks.app and
# demo.osabooks.app, on Cloudflare. nbparagliding.nz/osabooks and
# /osabooks_demo forward there (tools/redirects).
#
# Started by hand only (Actions tab, "Deploy website", "Run workflow"): the
# site changes when somebody decides it should, never as a side effect of a
# push. The tests run first, and nothing is uploaded if they fail.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to put online
        type: choice
        options: [both, app, demo]
        default: both

# One deploy at a time: two uploading at once could leave the site half of each.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build the demo, then the app
        # The demo build builds the app first and copies it; the app is built
        # again after so its folder holds the app alone.
        run: |
          npm run build:demo
          npm run build -w @nzosa/web
          # The Claude Desktop extension, offered on the AI page.
          npm run build -w @nzosa/mcp
          node tools/build-mcpb.mjs

      # Each app at an address of its own on Cloudflare (osabooks.app,
      # demo.osabooks.app), off nbparagliding.nz, whose other sites shared its
      # browser storage (code review of 20 November, section 5).
      - name: Publish the app
        if: inputs.target == 'app' || inputs.target == 'both'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare-deploy.mjs apps/web/dist osabooks osabooks.app

      - name: Publish the demo
        if: inputs.target == 'demo' || inputs.target == 'both'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare-deploy.mjs online-demo osabooks-demo demo.osabooks.app

      - name: Check the live site
        # Pages, demo books, the old addresses, the extension, and the AI
        # connector refusing a request with no sign-in. Reads only.
        run: node tools/after-deploy.mjs ${{ inputs.target }}
