# Put the Supabase Edge Functions behind the online books live.
#
# Started by hand only (Actions tab, "Deploy Supabase functions", "Run
# workflow"), like the website. The access token is the repository secret
# SUPABASE_ACCESS_TOKEN; the project ref is public -- it is in every request
# the app makes.
name: Deploy Supabase functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Which function to deploy
        type: choice
        options: [akahu, wise, gemini, gemini-demo, nightly, signup-alert, mcp, reminders, stripe, invite, all]
        default: akahu

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: ronancqtbbqmsiatxmfn

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # The two functions that run the app's own code get it bundled into
      # their folders first (built output, not kept in git).
      - name: Bundle
        run: |
          npm run build -w @nzosa/core
          node tools/build-nightly-function.mjs
          node tools/build-mcp-function.mjs

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHOSEN: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "The SUPABASE_ACCESS_TOKEN secret is not set." >&2
            exit 1
          fi
          if [ "$CHOSEN" = "all" ]; then names="akahu wise gemini gemini-demo nightly signup-alert mcp reminders stripe invite"; else names="$CHOSEN"; fi
          for name in $names; do
            echo "Deploying $name"
            # Called with no Supabase sign-in, each checking its caller itself: the morning run,
            # reminders and the sign-up alert by the database, the connector by its own OAuth,
            # the demo by visitors who are not signed in. Deployed otherwise, the gateway would
            # turn them all away (gemini-demo was missing here, and would have been).
            flags=""
            case "$name" in nightly|signup-alert|mcp|reminders|gemini-demo) flags="--no-verify-jwt" ;; esac
            npx --yes supabase functions deploy "$name" $flags --use-api --project-ref "$PROJECT_REF" --yes
          done
